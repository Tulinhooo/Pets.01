<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Friends&Mel</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #fff7f0, #ffe8d6);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
            color: #3d3028;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 700;
            color: #d86f45;
        }

        .logo span {
            color: #3d3028;
        }

        .cadastro-box {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(80, 50, 30, 0.12);
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fff0e5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
        }

        h1 {
            text-align: center;
            font-family: "Playfair Display", serif;
            font-size: 32px;
            margin-bottom: 10px;
            color: #3d3028;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }

        input:focus {
            border-color: #d86f45;
            box-shadow: 0 0 0 3px rgba(216, 111, 69, 0.12);
        }

        .btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: #d86f45;
            color: white;
        }

        .btn-primary:hover {
            background: #bd5933;
            transform: translateY(-2px);
        }

        .back {
            display: block;
            margin: 0 auto 25px;
            border: none;
            background: none;
            color: #d86f45;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .back:hover {
            text-decoration: underline;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #d86f45;
            font-weight: 700;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .mensagem {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
        }

        .sucesso {
            display: block;
            background: #e7f8ed;
            color: #267344;
        }

        .erro {
            display: block;
            background: #ffe8e8;
            color: #a83232;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .cadastro-box {
                padding: 28px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            🐾 Friends&<span>Mel</span>
        </div>

        <div class="cadastro-box">

            <button class="back" onclick="voltarInicio()">
                ← Voltar para a página inicial
            </button>

            <div class="icon">
                🐶
            </div>

            <h1>Crie sua conta</h1>

            <p class="subtitle">
                Cadastre-se para cuidar ainda melhor do seu melhor amigo.
            </p>

            <form id="formCadastro">

                <label for="nome">
                    Seu nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="seu@email.com"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Crie uma senha"
                    minlength="6"
                    required
                >

                <label for="confirmarSenha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Digite a senha novamente"
                    minlength="6"
                    required
                >

                <button class="btn btn-primary" type="submit">
                    Criar minha conta
                </button>

            </form>

            <div id="mensagem" class="mensagem"></div>

            <p class="login-link">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </div>

    </div>

    <script>
        const formCadastro = document.getElementById("formCadastro");
        const mensagem = document.getElementById("mensagem");

        formCadastro.addEventListener("submit", function(event) {

            event.preventDefault();

            const nome = document.getElementById("nome").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmarSenha").value;

            mensagem.className = "mensagem";

            if (senha.length < 6) {
                mensagem.textContent = "A senha precisa ter pelo menos 6 caracteres.";
                mensagem.classList.add("erro");
                return;
            }

            if (senha !== confirmarSenha) {
                mensagem.textContent = "As senhas não são iguais.";
                mensagem.classList.add("erro");
                return;
            }

            const usuario = {
                nome: nome,
                email: email,
                senha: senha
            };

            localStorage.setItem("usuarioFriendsMel", JSON.stringify(usuario));

            mensagem.textContent = "Conta criada com sucesso! Redirecionando...";
            mensagem.classList.add("sucesso");

           setTimeout(function() {
    window.location.href = "login.html";
}, 2000);
        });

        function voltarInicio() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
